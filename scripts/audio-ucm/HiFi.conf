# TB322FC (elden) — Secondary MI2S -> Awinic AW88461 x2 speakers
SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='Left Playback Volume' 1023"
		cset "name='Right Playback Volume' 1023"
	]
	DisableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' on"
	]
	DisableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' off"
	]
	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal analog microphone (WCD939x AMIC1)"
	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' on"
		cset "name='ADC2 MUX' 'CH2_AMIC1'"
		cset "name='ADC2 Switch' on"
		cset "name='ADC2_MIXER Switch' on"
		cset "name='ADC2 Volume' 20"
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'SWR_MIC1'"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
	]
	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off"
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
	]
	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
