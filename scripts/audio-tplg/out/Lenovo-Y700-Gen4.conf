SectionControlMixer."MultiMedia1" {
	reg "-1"
	index "0"
	max "1"
	invert "false"

	channel."fl" {
                reg "-1"
    		max "1"
        }

	ops."ctl" {
		get "256"
		put "256"
		info "1"
	}

	data [
                "stream0.sub_graph1_data"
	]
}

SectionGraph."stream0.1 Graph" {
