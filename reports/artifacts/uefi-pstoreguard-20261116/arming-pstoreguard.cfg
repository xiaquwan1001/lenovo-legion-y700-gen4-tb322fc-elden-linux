# 2026-11-16 pstore-guard 验证用嵌入菜单（UEFI/GRUB 路径；ESP BOOTAA64.EFI 是嵌入菜单件，改 grub.cfg 无效）
#   目的：同一颗内核（/boot/Image = build/daily v7.3.1-5-g4bdf1711b5，含 ramoops_skip_zone 守卫）、
#   同一份 64 MB initrd、同一 cmdline，只改 DTB 里的 ramoops 节点：
#     臂 1（默认）= /boot/elden.dtb            （含 ramoops@c2000000，昨夜必失败的那份）
#     臂 2（对照）= /boot/elden-noramoops.dtb  （删掉 ramoops 节点，昨夜能起进 SSH 的那份）
#   判据：臂 1 若出现 `ignoring console zone … overlaps the initrd` 并起进系统 ⇒ 守卫在真机生效。
#   每步写 grubenv（不拍屏也知道 GRUB 走到哪，PITFALLS #277）。
set timeout=20
set default=0

insmod all_video
insmod video
insmod font
insmod gfxterm
insmod gfxmenu

loadfont (memdisk)/boot/grub/fonts/big.pf2
set gfxmode=3040x1904x32,1904x3040x32,1920x1200x32,1280x800x32,1024x768x32,auto
set gfxpayload=keep
if terminal_output gfxterm; then
  true
else
  loadfont (memdisk)/boot/grub/fonts/med.pf2
  if terminal_output gfxterm; then
    true
  else
    loadfont (memdisk)/boot/grub/fonts/small.pf2
    terminal_output gfxterm
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set elden_cmdline="console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17"

menuentry "G1 守卫验证：ramoops 在（昨夜必失败，默认）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="41-G1-selected"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if devicetree ($root)/boot/elden.dtb; then set elden_grub_log="41-G1-dtb-ok"; else set elden_grub_log="4A-G1-dtb-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if linux ($root)/boot/Image $elden_cmdline elden_bootmenu=grub-G1; then set elden_grub_log="41-G1-linux-ok"; else set elden_grub_log="4A-G1-linux-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if initrd ($root)/boot/initrd.img; then set elden_grub_log="41-G1-initrd-ok-booting"; else set elden_grub_log="4A-G1-initrd-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
}

menuentry "G2 对照：ramoops 不在（elden-noramoops.dtb）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="42-G2-selected"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
  devicetree ($root)/boot/elden-noramoops.dtb
  linux ($root)/boot/Image $elden_cmdline elden_bootmenu=grub-G2
  initrd ($root)/boot/initrd.img
  set elden_grub_log="42-G2-booting"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
}

menuentry "D 走 ESP Loader.efi（11-08 路径，对照）" {
  search --no-floppy --label --set=esp ELDENESP
  chainloader ($esp)/EFI/elden/Loader.efi
}

menuentry "reboot" { reboot }
menuentry "poweroff" { halt }
