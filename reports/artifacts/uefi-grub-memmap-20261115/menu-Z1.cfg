set timeout=10
set pager=0
insmod all_video
insmod font
insmod gfxterm
insmod ext2
insmod fat
insmod part_msdos
insmod search
insmod linux
insmod hashsum
insmod lsefimmap
menuentry "Z1 diag" {
  set root=(hd0,1)
  echo "== SHA256 INITRD (want 3282ae..) =="
  hashsum --hash sha256 ($root)/boot/initrd64.img
  echo "== SHA256 IMAGE =="
  hashsum --hash sha256 ($root)/boot/Image
  echo "== EFI MEMMAP =="
  lsefimmap
  echo "== DIAG DONE =="
  sleep 3
  linux ($root)/boot/Image console=ttyAMA0,115200 loglevel=8 ignore_loglevel panic=0
  initrd ($root)/boot/initrd64.img
  boot
}
