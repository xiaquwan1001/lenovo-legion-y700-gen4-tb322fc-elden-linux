# 2026-11-14 v6-arming：UEFI 复测用**嵌入菜单**（ESP 上的 BOOTAA64.EFI 是嵌入菜单版，不读 linux17 的 grub.cfg）
#   ⇒ 想改「默认臂 / 加 earlycon」只能重打 EFI，再 --activate 到 ESP。
#   字体：三档 96/72/40 px 自动降级（gfxterm 硬约束 ≥40 列 × ≥12 行，PITFALLS #621）。
#   判据：每臂都写 /boot/grub/grubenv 的 elden_grub_log ⇒ 不拍屏也能知道 GRUB 走到哪（PITFALLS #277）。
set timeout=20
set default=0

insmod all_video
insmod video
insmod font
insmod gfxterm
insmod gfxmenu

loadfont (memdisk)/boot/grub/fonts/big.pf2
set gfxmode=3040x1904x32,1904x3040x32,1920x1200x32,1280x800x32,1024x768x32,auto
set gfxpayload=keep
if terminal_output gfxterm; then
  true
else
  loadfont (memdisk)/boot/grub/fonts/med.pf2
  if terminal_output gfxterm; then
    true
  else
    loadfont (memdisk)/boot/grub/fonts/small.pf2
    terminal_output gfxterm
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "A2'' 复测：nopstorecons DTB + earlycon=efifb + panic=0（默认）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="31-A2p-selected"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if devicetree ($root)/boot/elden-nopstorecons.dtb; then set elden_grub_log="31-A2p-dtb-ok"; else set elden_grub_log="3A-A2p-dtb-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=0 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-A2p; then set elden_grub_log="31-A2p-linux-ok"; else set elden_grub_log="3A-A2p-linux-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
  if initrd ($root)/boot/initrd.img; then set elden_grub_log="31-A2p-initrd-ok-booting"; else set elden_grub_log="3A-A2p-initrd-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_grub_log
}

menuentry "A2 panic=15（对照：失败自己重启回 b 槽）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="32-A2p15-selected"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
  devicetree ($root)/boot/elden.dtb
  linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-A2p15
  initrd ($root)/boot/initrd.img
}

menuentry "A 基线（无 earlycon，预期黑屏；单变量对照）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="33-Abase-selected"; save_env -f ($root)/boot/grub/grubenv elden_grub_log
  devicetree ($root)/boot/elden.dtb
  linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-Abase
  initrd ($root)/boot/initrd.img
}

menuentry "D 走 ESP Loader.efi（11-08 路径，对照）" {
  search --no-floppy --label --set=esp ELDENESP
  chainloader ($esp)/EFI/elden/Loader.efi
}

menuentry "reboot" { reboot }
menuentry "poweroff" { halt }
