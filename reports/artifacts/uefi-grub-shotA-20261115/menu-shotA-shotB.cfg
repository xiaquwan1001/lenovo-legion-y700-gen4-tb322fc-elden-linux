# 2026-11-15 Shot A：GRUB 读路径 sha 判决（主产物写进 linux17 的 /boot/grub/grubenv，宿主机可直接读）
#   判据：elden_shotA_sha=OK ⇒ GRUB/Mu 的读路径清白 ⇒ 「64 MB 缓冲区被写坏」落在 Mu 分配页（C2）；
#         =BAD ⇒ Mu UEFI 的大块 BlockIo 读回错字节（C1）。全程不启内核、不写分区，末尾 reboot。
set timeout=6
set default=1
insmod all_video
insmod font
insmod gfxterm
insmod ext2
insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_label
insmod linux
insmod hashsum
insmod loadenv

menuentry "ShotA: read-path sha verdict -> grubenv (no boot)" {
  search --no-floppy --label --set=root linux17
  set elden_shotA="0-selected"
  save_env -f ($root)/boot/grub/grubenv elden_shotA
  if hashsum --hash sha256 -p ($root) -c ($root)/boot/shotA.sha ; then
    set elden_shotA_sha="OK"
  else
    set elden_shotA_sha="BAD"
  fi
  save_env -f ($root)/boot/grub/grubenv elden_shotA_sha
  set elden_shotA="1-done"
  save_env -f ($root)/boot/grub/grubenv elden_shotA
  sleep 3
  reboot
}

menuentry "ShotB: initrd via cmdline (SFS path) + boot, panic=15" {
  search --no-floppy --label --set=root linux17
  set elden_shotA="B-selected"
  save_env -f ($root)/boot/grub/grubenv elden_shotA
  if devicetree ($root)/boot/elden-nopstorecons.dtb; then set elden_shotA="B-dtb-ok"; else set elden_shotA="B-dtb-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_shotA
  if linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-shotB initrd=/boot/initrd.img
  then set elden_shotA="B-linux-ok-booting"; else set elden_shotA="B-linux-FAIL"; fi
  save_env -f ($root)/boot/grub/grubenv elden_shotA
  sleep 3
}
