# /etc/elden-keyboard.conf — 「键盘设置」应用维护的键盘配置（键=值，# 为注释）
#
# 由 elden-keyboard-settings 写入，由 elden-keyboard-apply 并进 /etc/environment
# （ELDEN_OSK_HAPTIC_* 三键）。/etc/environment 是 root 拥有的系统文件，
# 所以普通应用不直接写它，而是写本文件 + 提权执行 apply 同步。
#
# HAPTIC_MS  震动时长（毫秒，十进制，建议 20-60；补丁默认 30）
# HAPTIC_MAG 震动幅度（0x2000=弱 / 0x3333=中 / 0x6666=强，或 0-0xffff；默认 0x3333）
# HAPTIC_DEV 马达节点（v1 只读展示；留空 = 走补丁默认自动选择，如 /dev/input/event2）

HAPTIC_MS=30
HAPTIC_MAG=0x3333
# HAPTIC_DEV=/dev/input/event2

# SOUND      按键声音开关（1=开，0=关；默认 0）。需要 osk-stub 带 sound/0002 补丁
# SOUND_VOL  按键音量（0-100，默认 60）；播放器 /usr/local/bin/osk-keysound 用它
SOUND=1
SOUND_VOL=60
