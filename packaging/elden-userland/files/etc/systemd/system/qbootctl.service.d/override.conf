# 2026-11-25：Debian qbootctl.service 的 ExecStart=`qbootctl -m` 在 bootdev 目录就绪前**每次开机必失败**
#   （实测 journal：`get_number_slots: Failed to open bootdev dir` → status=1；同因 PITFALLS #181）
#   ⇒ 换成带等待/重试/复核的包装（本仓 packaging/elden-userland/files/usr/local/sbin/qbootctl-mark.sh）。
#   部署：/etc/systemd/system/qbootctl.service.d/override.conf + systemctl daemon-reload + restart。
#   实测（2026-11-25，vk192）：active、ExecMainStatus=0、`qbootctl -n b` = "SLOT _b: is marked successful"。
[Service]
ExecStart=
ExecStart=/usr/local/sbin/qbootctl-mark.sh
Restart=on-failure
RestartSec=5
