# /etc/tmpfiles.d/hexagonrpc.conf — writable overlay for the DSP (systemd 侧)
#
# elden-sensorspd 用 `hexagonrpcd ... -O /var/lib/hexagonrpc` 承载 sensors PD 的 registry 写。
# 该目录必须**预先存在且对运行用户可写**：/var/lib 下 unprivileged mkdir 会失败，
# hexagonrpcd 只打印 `Could not initialize write overlay ...: Permission denied` 后继续跑
# （服务 active、传感器正常，但**所有写静默丢失**）。
#
# 非 systemd（OpenRC）侧等价物：在 initd 的 start_pre 里
#   install -d -m 0755 -o fastrpc -g fastrpc /var/lib/hexagonrpc
d /var/lib/hexagonrpc 0755 fastrpc fastrpc -
