# Meson cross file: build Mesa for the TB322FC (aarch64, Ubuntu 26.04 sysroot).
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
llvm-config = '/bin/false'
cmake = '/bin/false'
# Code generators must be the host build; the sysroot copies are aarch64.
wayland-scanner = '/usr/bin/wayland-scanner'
glslangValidator = '/usr/bin/glslangValidator'

[built-in options]
c_args = ['--sysroot=/TB322FC/out/sysroot-arm64']
cpp_args = ['--sysroot=/TB322FC/out/sysroot-arm64']
c_link_args = ['--sysroot=/TB322FC/out/sysroot-arm64']
cpp_link_args = ['--sysroot=/TB322FC/out/sysroot-arm64']

[properties]
sys_root = '/TB322FC/out/sysroot-arm64'
pkg_config_libdir = '/TB322FC/out/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/TB322FC/out/sysroot-arm64/usr/share/pkgconfig'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
