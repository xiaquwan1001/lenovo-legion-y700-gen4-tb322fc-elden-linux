# grep-time 引子（2026-11-10）：greetd 关机卡 90 s 的**设备侧兜底**
# 根因（2026-10-30 定案，reports/shutdown-greetd-hang-plan-20261030.md）：greetd 上游 check_children()
# 持 inner 写锁去 await start_greeter()，而 SIGTERM 处理 terminate() 抢同一把写锁 ⇒ 对 SIGTERM 无反应，
# 一直耗到默认 DefaultTimeoutStopSec=90s 才被 SIGKILL。
# 我们原有的 ExecStop hook（/usr/local/libexec/elden/greetd.stop 杀 session-worker）**没能让它及时退出**
# （2026-11-10 实测：卡满 session-c1.scope/stop 90 s ⇒ reboot bootloader +93 s），
# 所以再加这一层：停等压到 10 s，让 systemd 尽早 SIGKILL（KillMode=control-group 连 worker 一起收）。
# 2026-11-10 实测（上一 boot）：`final.target` 2 s 达成、`Timed out` 计数 0。
[Service]
TimeoutStopSec=10
