# meson 交叉编 phoc/phosh 到 Debian-13(trixie) arm64 —— 不需要 root chroot（T45）
# 用法：ELDEN_AARCH64_SYSROOT=<repo>/out/sysroot-trixie-arm64 PKG_CONFIG_LIBDIR=... \
#         meson setup _b --cross-file rootfs/cross-aarch64-phoc.ini -Dembed-wlroots=disabled
[binaries]
c = '/home/xuqianhui/y700-elden/build/tools/cc-aarch64-trixie.sh'
cpp = '/home/xuqianhui/y700-elden/build/tools/cc-aarch64-trixie.sh'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64/usr/share/pkgconfig'
