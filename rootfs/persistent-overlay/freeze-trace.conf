# PITFALLS #106「进 GUI 后整机卡死」取证装弹（2026-10-09，用户批准常驻）
#
# 本机 APSS 硬看门狗被永久禁用（dmesg: Hard watchdog permanently disabled）⇒ 死挂永不自复位，
# 历史上只能物理断电，因此该问题从 2026-10-05 起一直「未定性」。
# 这四项把「死挂」变成「自动 panic → 20 s 暖复位 → ramoops 带回全 CPU 栈」：
#   软锁死探针（每 CPU watchdog 线程）命中即 panic，并且打**所有** CPU 的栈；
#   panic=20 ⇒ 20 秒后自动复位（**必须是暖复位**：断电会连带丢掉 ramoops）；
#   sysrq=1 ⇒ 也能从串口用 Magic SysRq 主动 s/u/b 抢救现场。
# 判读：下次开机 `ls /sys/fs/pstore` 或看 /var/log/pstore/（pstore-catch 服务会归档到盘）。
# 关掉：删掉本文件并 sysctl -w kernel.softlockup_panic=0 kernel.panic=0
kernel.softlockup_panic = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.panic = 20
kernel.sysrq = 1
