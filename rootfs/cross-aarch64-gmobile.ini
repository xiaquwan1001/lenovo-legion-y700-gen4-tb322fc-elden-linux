# Meson cross file: small aarch64 sysroot matching the device's Debian trixie
# glib/json-glib sonames (used for userland pieces like libgmobile, 2026-11-28).
# Sysroot built by: SUITE=trixie MIRROR=http://deb.debian.org/debian \
#   PKGS_ENV="libgio-2.0-dev libglib2.0-0t64 libjson-glib-1.0-0 libjson-glib-dev \
#   libffi-dev libffi8 libpcre2-dev libpcre2-8-0 zlib1g-dev zlib1g libc6-dev linux-libc-dev" \
#   SYSROOT=$PWD/out/sysroot-trixie-arm64 bash rootfs/build-sysroot.sh
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
# Code generators must be host builds
glib-compile-resources = '/usr/bin/glib-compile-resources'

[built-in options]
c_args = ['--sysroot=/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64']
cpp_args = ['--sysroot=/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64']
c_link_args = ['--sysroot=/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64']
cpp_link_args = ['--sysroot=/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64']

[properties]
sys_root = '/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64'
pkg_config_libdir = '/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/home/xuqianhui/y700-elden/out/sysroot-trixie-arm64/usr/share/pkgconfig'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
