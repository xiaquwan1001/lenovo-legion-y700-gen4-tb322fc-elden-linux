# 2026-11-15 DBG v2：内核侧 initrd 取证一发（GRUB 路径，LoadFile2 交 64 MB）
#   - 大字菜单（big.pf2 96px + 原生 gfxmode）：用户 2026-11-15 反馈 v1 菜单字太小
#   - 内核侧：quiet loglevel=3 ⇒ 只有 ELDEN[resv]/[unpack-in]/[unpack-out]/[diag] 与 panic 相关行；
#     每行打印后停 1.2 s，panic 时 panic_notifier 在栈底**重打一遍**（每行停 1.8 s），
#     panic=30 ⇒ 最终屏面静止 30 s，可以直接拍照、无滚屏残影。
# 2026-11-15 21:2x v3：发现 initrd buffer 0xc23e0000 落在 DTB 的 ramoops 保留区 0xc2000000+8MB 之内！
#   ⇒ 新增 noramoops DTB（删掉该 8 MB no-map 节点）作为默认臂：若这一发**能起**（SSH 回来）= root cause 确认。
# 判据（ELDEN[unpack-in] / ELDEN[pn] 里的那一行）：
#   sum=0x5c53688e tail=8eff7f5eb9feff01db29f8bf008ad60a ⇒ 内核读到时内容仍正确 ⇒ 破坏在 unpack 过程之中（并发写）
#   其它值                                              ⇒ 内核读到时已被改（EBS 之后、unpack 之前）
#   ELDEN[diag] this_header=/inptr=/bytes@... ⇒ 断点偏移与那一带的真实字节（全 0 = 被清零）
set timeout=10
set default=1

insmod all_video
insmod video
insmod font
insmod gfxterm
insmod gfxmenu
insmod ext2
insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_label
insmod linux
insmod loadenv

loadfont (memdisk)/boot/grub/fonts/big.pf2
set gfxmode=3040x1904x32,1904x3040x32,1920x1200x32,1280x800x32,1024x768x32,auto
set gfxpayload=keep
if terminal_output gfxterm; then
  true
else
  loadfont (memdisk)/boot/grub/fonts/med.pf2
  if terminal_output gfxterm; then
    true
  else
    loadfont (memdisk)/boot/grub/fonts/small.pf2
    terminal_output gfxterm
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "DBG1: noramoops DTB + 64MB initrd (LoadFile2) —— 决定性一发" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="dbg1-noramoops"
  devicetree ($root)/boot/elden-noramoops.dtb
  linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-dbg-noramoops
  initrd ($root)/boot/initrd.img
}

menuentry "DBG2: elden.dtb（pstore console 已开）+ 64MB initrd —— 失败也有回读通道" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="dbg2-pstore"
  devicetree ($root)/boot/elden.dtb
  linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-dbg-pstore
  initrd ($root)/boot/initrd.img
}

menuentry "DBG3: 小 initrd 对照（1MB, LoadFile2）" {
  search --no-floppy --label --set=root linux17
  set elden_grub_log="dbg3-slim"
  devicetree ($root)/boot/elden.dtb
  linux ($root)/boot/Image console=ttyGS0,115200 console=tty0 earlycon=efifb keep_bootcon loglevel=8 ignore_loglevel printk.devkmsg=on panic=15 clk_ignore_unused pd_ignore_unused arm-smmu.disable_bypass=0 elden_root=LABEL=linux17 androidboot.slot_suffix=_b elden_nocamera=1 root=LABEL=linux17 elden_bootmenu=grub-dbg-slim
  initrd ($root)/boot/initrd-slim.img
}

menuentry "reboot" { reboot }
menuentry "poweroff" { halt }
