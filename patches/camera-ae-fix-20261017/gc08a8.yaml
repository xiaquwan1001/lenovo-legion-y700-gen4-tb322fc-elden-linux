# Per-sensor tuning for gc08a8 (TB322FC / elden).
# blackLevel is a 16-bit value: sensor pedestal is 64 at 10-bit => 64 << 6 = 4096.
# exposureTarget MUST be >= ~0.28: the AGC MSV has only 5 bins (values 1..5),
# so a lower target is unreachable and the loop never raises the exposure (black frames).
# 0.30 keeps the 18% linear grey intent after the 2.2 gamma.
# (the IPA default 0.5 targets mid-grey linearly and looks washed out on this ISP).
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
      exposureTarget: 0.30
...
